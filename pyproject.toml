[project]
name = "geo-agent"
version = "0.1.0"
description = "Geo Agent - AI Spatial & Geographic Intelligence Service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.54.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "sqlalchemy>=2.1.1",
    "alembic>=1.20.0",
    "pyyaml>=6.0.3",
    "typesafe-sdk>=0.7.2",
    "psycopg2-binary>=2.9.13",
    "playwright>=1.49.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

